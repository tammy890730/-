<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾頁・修復開啟</title><link rel="icon" href="./shiye-green-transparent.ico"><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f0;color:#263c30;font:16px/1.8 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:600px;margin:8vh auto;padding:32px;background:#fff;border:1px solid #dae3d5;border-radius:18px}img{width:64px;height:64px}h1{font-size:25px}button{font:inherit;background:#28584b;color:#fff;border:0;border-radius:9px;padding:14px 22px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#28584b}#status{min-height:2em}.hint{color:#53624f}@media(max-width:640px){main{margin:20px;padding:24px}}</style></head><body><main><img src="./shiye-green-clear-192.png" alt=""><h1>修復拾頁開啟</h1><p>這個操作只重建拾頁的程式快取，<strong>不會刪除文獻、PDF、筆記或研究主題</strong>。</p><p class="hint">請先儲存並關閉其他拾頁視窗，保持網路連線，再按下方按鈕。</p><button id="repair" type="button">修復並重新開啟拾頁</button><p id="status" role="status" aria-live="polite"></p><p><a href="./">先返回拾頁</a></p></main><script>
(function(){var button=document.getElementById('repair'),status=document.getElementById('status');button.addEventListener('click',async function(){if(!navigator.onLine){status.textContent='請先連上網路，再進行修復。';return;}if(!confirm('請確認其他拾頁視窗已儲存並關閉。此操作只重建程式快取，文獻、PDF、筆記與主題會保留。確定繼續？'))return;button.disabled=true;status.textContent='正在修復程式，文獻資料保留中…';try{var root=new URL('./',location.href);if('serviceWorker'in navigator){var registrations=await navigator.serviceWorker.getRegistrations();for(var registration of registrations){if(registration.scope===root.href)await registration.unregister();}}if('caches'in window){var names=await caches.keys();for(var name of names){if(name.startsWith('shiye-app-'))await caches.delete(name);}}status.textContent='程式快取已修復，正在重新開啟…';location.replace(root.href+'?repaired=1');}catch(error){button.disabled=false;status.textContent='修復尚未完成，請保持網路連線再試。你的文獻資料未被清除。';}});})();
</script></body></html>
